# Detekt configuration tuned for the Saikou codebase.
#
# Philosophy: keep the genuinely-useful rules (complexity, exceptions,
# potential-bugs) on. Disable rules that consistently produce noise we
# don't act on (MagicNumber for UI px values, ReturnCount in UI code).
# Override only when defaults clash with the project's existing style.
#
# Run with: ./gradlew detekt
# Auto-fix formatting: ./gradlew detekt --auto-correct (formatting rules only)

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: false
  checkExhaustiveness: false

processors:
  active: true

console-reports:
  active: true
  exclude:
    - 'ProjectStatisticsReport'
    - 'ComplexityReport'
    - 'NotificationReport'
    - 'FindingsReport'
    - 'FileBasedFindingsReport'

output-reports:
  active: true
  exclude: []

# ─── Comments ────────────────────────────────────────────────────────────
# Off by default — we don't enforce "every public class needs a KDoc".
# Comments policy is in CLAUDE.md (write WHY, not WHAT) and reviewed manually.
comments:
  active: false

# ─── Complexity ──────────────────────────────────────────────────────────
complexity:
  active: true
  CyclomaticComplexMethod:
    active: true
    threshold: 25  # Compose screens with state branching legitimately hit ~20.
    ignoreAnnotated:
      - 'Composable'  # @Composable is the framework-driven entry point — many `when`s on state.
  LongMethod:
    active: true
    threshold: 150  # Compose screens are vertically tall by design (one screen often = one fun).
    ignoreAnnotated:
      - 'Composable'
  LongParameterList:
    active: true
    functionThreshold: 8     # ViewModel constructors after DI bloat the param list legitimately.
    constructorThreshold: 12
    ignoreDataClasses: true
    ignoreDefaultParameters: true
    ignoreAnnotated:
      - 'Composable'  # Composable signatures are routinely 5–10 params. That's idiomatic.
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 25
    # 30 — Room DAOs legitimately accumulate many query methods as features
    # grow. Splitting one DAO into multiple just to satisfy the rule would
    # split related queries across files for no real benefit.
    thresholdInInterfaces: 30
    thresholdInObjects: 25
    ignorePrivate: true
    ignoreOverridden: true
  NestedBlockDepth:
    active: true
    threshold: 5  # Default 4. Coil/Ktor builder DSLs nest naturally.

# ─── Coroutines ──────────────────────────────────────────────────────────
coroutines:
  active: true
  GlobalCoroutineUsage:
    active: true
  RedundantSuspendModifier:
    active: true
  SuspendFunWithCoroutineScopeReceiver:
    active: true

# ─── Empty blocks ────────────────────────────────────────────────────────
empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'

# ─── Exceptions ──────────────────────────────────────────────────────────
exceptions:
  active: true
  TooGenericExceptionCaught:
    active: false  # We deliberately catch Exception in best-effort blocks (parsers, breadcrumbs).
  SwallowedException:
    active: false  # Same — best-effort logging frequently swallows.
  InstanceOfCheckForException:
    active: true
  NotImplementedDeclaration:
    active: true
  PrintStackTrace:
    active: true

# ─── Naming ──────────────────────────────────────────────────────────────
naming:
  active: true
  FunctionNaming:
    active: true
    functionPattern: '[a-z][a-zA-Z0-9]*'
    ignoreAnnotated:
      - 'Composable'  # Composable funs are PascalCase by convention.
  TopLevelPropertyNaming:
    # Disabled — Compose theme files (`val Primary = Color(0xFFXXX)`,
    # `val Background`), Koin modules (`val appModule = module { ... }`),
    # and tour-step lists (`val DefaultHomeTourSteps = listOf(...)`) all
    # legitimately use PascalCase or descriptive names that don't fit a
    # constant-vs-property dichotomy. Reject the rule outright rather than
    # carve a regex that would inevitably miss future cases.
    active: false
  MatchingDeclarationName:
    # Disabled — Compose component files routinely co-locate a tightly-coupled
    # data class (e.g. ChapterDownloadState in ChapterRow.kt, SourceItem in
    # SourceSelectorSheet.kt). Splitting would just create two files where
    # one reads more naturally.
    active: false

# ─── Performance ─────────────────────────────────────────────────────────
performance:
  active: true
  ArrayPrimitive:
    active: true
  CouldBeSequence:
    active: false  # Often a false positive in tiny collections.
  ForEachOnRange:
    active: true
  SpreadOperator:
    active: true
  UnnecessaryTemporaryInstantiation:
    active: true

# ─── Potential bugs ──────────────────────────────────────────────────────
potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
  CastToNullableType:
    active: true
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  ExitOutsideMain:
    active: true
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
  ImplicitDefaultLocale:
    active: true
  LateinitUsage:
    active: false  # Android Service/Worker init pattern uses lateinit legitimately.
  MapGetWithNotNullAssertionOperator:
    active: true
  NullableToStringCall:
    active: true
  UnconditionalJumpStatementInLoop:
    active: true
  UnnecessaryNotNullCheck:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UselessPostfixExpression:
    active: true

# ─── Style ───────────────────────────────────────────────────────────────
style:
  active: true
  MagicNumber:
    active: false  # Generates massive false-positive volume in Compose dp/px values.
  MaxLineLength:
    # Disabled — ktlint already enforces this with the same 140-char limit
    # AND honors `@file:Suppress("ktlint:standard:max-line-length")` for
    # legitimate exceptions like AnilistQueries.kt. Detekt's MaxLineLength
    # ignores those suppressions, producing duplicate findings we already
    # gated through ktlint. One source of truth.
    active: false
  WildcardImport:
    active: true
    excludeImports: []
  ReturnCount:
    active: true
    max: 5  # JSON-deserialization paths chain ~5 guard returns before the success path.
    excludeReturnFromLambda: true
  ThrowsCount:
    active: true
    max: 3
  UnusedImports:
    active: true
  UnusedPrivateMember:
    active: true
  UnnecessaryAbstractClass:
    active: true
  UnnecessaryApply:
    active: true
  UnnecessaryLet:
    active: true
  UseCheckOrError:
    active: true
  UseRequire:
    active: true
  UtilityClassWithPublicConstructor:
    active: true
  ForbiddenComment:
    active: false  # We deliberately leave TODO/FIXME for follow-up work.
  DataClassContainsFunctions:
    active: false  # Domain models legitimately have computed properties.
  NewLineAtEndOfFile:
    active: true

# ─── Formatting ──────────────────────────────────────────────────────────
# Disabled — the standalone ktlint Gradle plugin (`./gradlew ktlintCheck`)
# already enforces these rules with the project's `.editorconfig`. Enabling
# detekt-formatting here means two ktlint engines run with subtly different
# defaults (e.g. continuation-indent), and they disagree on edge cases like
# indentation inside multi-line PrettyLog message arguments.
#
# We still ship `detekt-formatting` as a `detektPlugins` dep so other repos
# that consume this config can opt in — but we don't activate the rules.
formatting:
  active: false
